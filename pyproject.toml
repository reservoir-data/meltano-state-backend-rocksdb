[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs==0.5",
  "hatchling==1.31.0",
]

[project]
name = "meltano-state-backend-rocksdb"
description = "Meltano State Backend for RocksDB"
readme = "README.md"
keywords = [
  "backend",
  "meltano",
  "rocksdb",
  "rocksdict",
  "state",
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dynamic = [
  "version",
]
dependencies = [
  "meltano>=3.7",
  "rocksdict~=0.3",
  "typing-extensions>=4.15; python_full_version<'3.12'",
]
[[project.authors]]
name = "Edgar Ramírez Mondragón"
email = "edgarrm358@gmail.com"
[project.entry-points]
"meltano.settings".write_buffer_size = "meltano_state_backend_rocksdb.rocksdb:WRITE_BUFFER_SIZE"
"meltano.state_backends".rocksdb = "meltano_state_backend_rocksdb.rocksdb:RocksDBStateStoreManager"
[[project.maintainers]]
name = "Edgar Ramírez Mondragón"
email = "edgarrm358@gmail.com"

[dependency-groups]
dev = [
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [
  "coverage[toml]>=7.6.10",
  "pytest>=8",
  "pytest-github-actions-annotate-failures>=0.4",
]
typing = [
  "mypy>=1",
  "ty>=0.0.1a20",
]

[tool.hatch.version]
fallback = "0.1.0.dev0"
source = "vcs"

[tool.uv]
required-version = ">=0.10"
prerelease = "allow"
[tool.uv.sources]
meltano = { git = "https://github.com/meltano/meltano.git" }

[tool.ruff]
line-length = 88
preview = true
[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DOC",  # pydoclint
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle (error)
  "EM",   # flake8-errmsg
  "ERA",  # flake8-eradicate
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FIX",  # flake8-fixme
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLC",  # Pylint (Convention)
  "PLE",  # Pylint (Error)
  "PLR",  # Pylint (Refactor)
  "PLW",  # Pylint (Warning)
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TD",   # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (warning)
  "YTT",  # flake8-2020
]
ignore = [
  "suspicious-url-open-usage",
  "subprocess-without-shell-equals-true",
]
per-file-ignores."tests/**" = [
  "D",      # Don't lint docstrings in tests
  "assert",
]
flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true
flake8-annotations.suppress-dummy-args = true
flake8-pytest-style.parametrize-values-type = "tuple"
pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.14"
table_format = "long"

[tool.mypy]
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true
warn_unused_configs = true

[tool.pytest]
addopts = [
  "--durations=10",
  "-v",
  "-ra",
]
filterwarnings = [ "error" ]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.coverage.paths]
package = [
  "src/meltano_state_backend_rocksdb/",
  "*/site-packages/meltano_state_backend_rocksdb/",
]
[tool.coverage.report]
exclude_also = [
  "if (t\\.)?TYPE_CHECKING:",
]
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = [
  "meltano_state_backend_rocksdb",
  "tests",
]

[tool.tox]
requires = [ "tox>=4.51", "tox-uv" ]
env_list = [
  { product = [
    { prefix = "3.", start = 10 },
  ] },
  "coverage",
  "typing",
]
[tool.tox.env.coverage]
description = "combine and report coverage results"
dependency_groups = [ "testing" ]
commands = [
  [ "coverage", "combine", "--debug=pathmap" ],
  [ "coverage", "report", "--show-missing" ],
  [ "coverage", "xml" ],
]
depends = [
  "3.*",
]
[tool.tox.env.default]
[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "testing", "typing" ]
commands = [
  [
    "mypy",
    { replace = "posargs", default = [
      "src/meltano_state_backend_rocksdb",
      "tests",
    ], extend = true },
  ],
  [
    "ty",
    "check",
    { replace = "posargs", default = [
      "src/meltano_state_backend_rocksdb",
      "tests",
    ], extend = true },
  ],
]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run tests on Python {py_dot_ver}"
base_python_file = [ ".python-version" ]
dependency_groups = [ "testing" ]
pass_env = [
  "GITHUB_*",
]
set_env = { PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1" }
commands = [ [ "coverage", "run", "-m", "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
